name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  workflow_dispatch:

env:
  PLUGIN_NAME: footballer
  INTERNAL_NAME: footballer
  RELEASE_DIR: footballer/footballer/bin/x64/Release/footballer

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release_identity.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: footballer
          submodules: recursive
          persist-credentials: false

      - name: Checkout AethertekUI
        uses: actions/checkout@v4
        with:
          repository: McVaxius/aethertekUI
          ref: main
          path: aethertekUI
          # Repository-specific read-only SSH deploy key; no expiration.
          ssh-key: ${{ secrets.AETHERTEKUI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"

      - name: Determine release identity
        id: release_identity
        working-directory: footballer
        run: |
          $version = ([xml](Get-Content footballer/footballer.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Release tag must match the plugin version.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData/XIVLauncher/addon/Hooks/dev/"

      - name: Build
        working-directory: footballer
        run: |
          $dalamudLibPath = "$env:AppData/XIVLauncher/addon/Hooks/dev"
          dotnet restore footballer/footballer.csproj -p:Configuration=Release -p:Platform=x64 -p:DalamudLibPath="$dalamudLibPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build footballer/footballer.csproj --configuration Release --no-restore -p:Platform=x64 -p:DalamudLibPath="$dalamudLibPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Render and validate previews
        working-directory: footballer
        run: |
          $dalamudLibPath = "$env:AppData/XIVLauncher/addon/Hooks/dev"
          dotnet build eng/Preview/Preview.csproj -c Release -p:DalamudLibPath="$dalamudLibPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runner = 'eng/Preview/bin/Release/net10.0-windows/Preview.dll'
          dotnet $runner render . previews "$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet $runner validate previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and package normal release previews
        working-directory: footballer
        env:
          RELEASE_TAG: ${{ steps.release_identity.outputs.tag }}
        run: |
          ./eng/Prepare-PreviewRelease.ps1 -ReleaseDirectory 'footballer/bin/x64/Release/footballer' -PreviewDirectory previews -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: |
            ${{ env.RELEASE_DIR }}/latest.zip
            ${{ env.RELEASE_DIR }}/${{ env.INTERNAL_NAME }}.json
            ${{ env.RELEASE_DIR }}/preview-*.png
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: artifact

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Release ${{ needs.build.outputs.release_tag }}
          draft: false
          prerelease: false
          preserve_order: true
          files: |
            artifact/preview-*.png
            artifact/latest.zip
            artifact/${{ env.INTERNAL_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
